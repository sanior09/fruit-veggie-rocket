<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Rounded sky badge -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#sky)" stroke="#1e293b" stroke-width="6" />

  <!-- Cute clouds/stars -->
  <circle cx="28" cy="30" r="5" fill="#fef08a" />
  <circle cx="102" cy="34" r="4" fill="#ffffff" opacity="0.85" />

  <!-- Thruster flame -->
  <path d="M51 91 Q64 118 77 91 Z" fill="#f97316" stroke="#1e293b" stroke-width="4" stroke-linejoin="round" />
  <path d="M56 91 Q64 109 72 91 Z" fill="#fde047" />

  <!-- Rocket fins -->
  <path d="M44 65 Q24 77 28 95 L46 88 Z" fill="#ef4444" stroke="#1e293b" stroke-width="4.5" stroke-linejoin="round" />
  <path d="M84 65 Q104 77 100 95 L82 88 Z" fill="#ef4444" stroke="#1e293b" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Thruster nozzle -->
  <rect x="49" y="85" width="30" height="9" rx="4" fill="#64748b" stroke="#1e293b" stroke-width="4" />

  <!-- Rocket body -->
  <path d="M64 18 C86 35 88 68 83 87 L45 87 C40 68 42 35 64 18 Z" fill="url(#body)" stroke="#1e293b" stroke-width="5" stroke-linejoin="round" />

  <!-- Red nose cone -->
  <path d="M64 18 C75 27 81 37 83 45 L45 45 C47 37 53 27 64 18 Z" fill="#ef4444" stroke="#1e293b" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Porthole window -->
  <circle cx="64" cy="63" r="13" fill="#38bdf8" stroke="#1e293b" stroke-width="4.5" />
  <ellipse cx="59" cy="58" rx="4.5" ry="2.8" transform="rotate(-30 59 58)" fill="#ffffff" opacity="0.85" />

  <!-- Mini cute apple badge in bottom-right -->
  <g transform="translate(96 92)">
    <path d="M2 -13 Q11 -20 12 -10 Q6 -7 2 -13 Z" fill="#22c55e" stroke="#1e293b" stroke-width="3" stroke-linejoin="round" />
    <path d="M0 -10 C11 -16 18 -3 13 10 C9 17 3 17 0 14 C-3 17 -9 17 -13 10 C-18 -3 -11 -16 0 -10 Z" fill="#ef4444" stroke="#1e293b" stroke-width="3.5" stroke-linejoin="round" />
    <ellipse cx="-6" cy="-4" rx="2.5" ry="4.5" transform="rotate(20 -6 -4)" fill="#ffffff" opacity="0.55" />
  </g>
</svg>
